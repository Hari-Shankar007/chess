<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Worksheet Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0b6b6f; --primary-hover: #095357; --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --radius: 12px; --board-light: #ffffff; --board-dark: #cbd5e1; }
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.4; }
        .app { display: grid; grid-template-columns: 350px 1fr; height: 100vh; }
        .sidebar { background: #fff; padding: 30px 20px; border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .preview { padding: 30px; overflow-y: auto; display: flex; justify-content: center; background: #cbd5e1; }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .brand svg { width: 30px; height: 30px; color: var(--primary); }
        .brand h1 { font-family: 'Libre Baskerville', serif; font-size: 20px; margin: 0; }
        label { display: block; font-weight: 700; font-size: 11px; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
        input, textarea { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 13px; background: #f8fafc; }
        textarea { height: 160px; font-family: monospace; }
        .btn { width: 100%; padding: 12px; border-radius: 30px; font-weight: 700; cursor: pointer; border: none; font-size: 13px; text-align: center; background: var(--primary); color: #fff; }
                .page { width: 210mm; height: 297mm; background: #fff; padding: 12mm 15mm; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,0.1); position: relative; color: #000; display: flex; flex-direction: column; }
        .header { display: grid; grid-template-columns: 80px 1fr 140px; align-items: center; gap: 15px; border-bottom: 3px solid #000; padding-bottom: 12px; margin-bottom: 15px; }
        .logo-box { width: 70px; height: 70px; border: 1.5px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 9px; border-radius: 8px; }
        .logo-box img { max-width: 100%; max-height: 100%; }
        .title-block { text-align: center; }
        .title-block h2 { font-family: 'Libre Baskerville', serif; font-size: 20px; margin: 0; }
        .title-block p { font-size: 11px; color: #444; margin: 4px 0 0; font-weight: 500; }
        .contact { text-align: right; font-size: 10px; line-height: 1.3; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10mm 12mm; flex-grow: 1; }
        .puzzle { display: flex; flex-direction: column; width: 100%; }
        .p-meta { display: flex; justify-content: space-between; font-weight: 900; font-size: 10px; border-bottom: 1.5px solid #000; margin-bottom: 3px; padding-bottom: 2px; }
        .board-wrap { width: 100%; aspect-ratio: 1/1; border: 1.5px solid #000; position: relative; }
        .board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
        .square { display: flex; align-items: center; justify-content: center; position: relative; }
        .light { background: #ffffff; }
        .dark { background: #cbd5e1; }
        .piece { font-size: 24px; line-height: 1; z-index: 2; }
        .coord { position: absolute; font-size: 7px; font-weight: 900; z-index: 1; opacity: 0.7; }
        .coord.f { right: 1px; bottom: 0px; }
        .coord.r { left: 1px; top: 0px; }
        .light .coord { color: #666; }
        .dark .coord { color: #333; }
        .move-text { text-align: center; font-size: 9px; font-weight: 900; margin-top: 5px; padding: 3px; border: 1.5px solid #000; text-transform: uppercase; background: #fff; }
        .footer-ws { text-align: center; font-size: 9px; color: #999; border-top: 1px solid #eee; padding-top: 8px; margin-top: 5px; }
        @media print {
                body { background: #fff !important; }
        .sidebar { display: none !important; }
        .preview { padding: 0 !important; background: none !important; display: block !important; }
        .page { width: 210mm !important; height: 297mm !important; box-sizing: border-box !important; background: #fff !important; box-shadow: none !important; margin: 0 !important; padding: 8mm !important; page-break-after: always; display: flex !important; flex-direction: column !important; overflow: visible !important; }
        .header { flex-shrink: 0 !important; padding-bottom: 4px !important; margin-bottom: 4px !important; border-bottom: 2px solid #000 !important; }
        .grid { display: grid !important; grid-template-columns: repeat(3, 61mm) !important; grid-template-rows: repeat(3, 82mm) !important; gap: 4mm !important; flex: 1 !important; justify-content: space-between !important; }
        .puzzle { display: flex !important; flex-direction: column !important; width: 61mm !important; overflow: visible !important; }
        .p-meta { font-size: 7px !important; padding-bottom: 1px !important; margin-bottom: 1px !important; flex-shrink: 0 !important; }
        .board-wrap { width: 61mm !important; height: 61mm !important; flex-shrink: 0 !important; border: 1.5px solid #000 !important; position: relative !important; display: block !important; }
        .board { position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; display: grid !important; grid-template-columns: repeat(8, 1fr) !important; grid-template-rows: repeat(8, 1fr) !important; }
        .move-text { font-size: 7px !important; margin-top: 2px !important; padding: 2px !important; }
        .piece { font-size: 16px !important; line-height: 1 !important; }
        .coord { font-size: 5px !important; }
        .dark { background-color: #cbd5e1 !important; }
        .light { background-color: #ffffff !important; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                <h1>EduChess</h1>
            </div>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="wsTitle" value="EduChess Academy Puzzle Worksheet">
            </div>
            <div class="form-group">
                <label>Contact</label>
                <input type="text" id="wsContact" value="+91 0000 0000 00">
            </div>
            <div class="form-group">
                <label>Sub-header</label>
                <input type="text" id="wsSub" value="Solve the positions. White or Black to move is shown below each board.">
            </div>
            <div class="form-group">
                <label>Logo</label>
                <input type="file" id="logoIn" accept="image/*">
            </div>
            <div class="form-group">
                <label>FENs (up to 9)</label>
                <textarea id="fens" spellcheck="false" placeholder="Paste FENs here...">r1bqkbnr/pppp1ppp/2n5/4p3/3P4/2N2N2/PPP1PPPP/R1BQKB1R w KQkq - 2 4&#10;2r3k1/5ppp/p2b4/1p1P4/1P6/P3R1P1/5P1P/4R1K1 w - - 0 1</textarea>
            </div>
            <button class="btn" onclick="render();window.print()">Print Worksheet</button>
            <button class="btn" style="background:#fff; border:2px solid var(--border); color:var(--text); margin-top:10px;" onclick="clearFens()">Clear FENs</button>
        </div>
        <div class="preview">
            <div class="page" id="page"></div>
        </div>
    </div>

    <script>
        const symbols = { 'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙', 'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟' };
        let logoData = null;

        function render() {
            const title = document.getElementById('wsTitle').value;
            const contact = document.getElementById('wsContact').value;
            const sub = document.getElementById('wsSub').value;
            const fensText = document.getElementById('fens').value;
            
            const fenList = fensText.match(/[rnbqkpRNBQKP1-8/]+\s+[wb]/g) || [];
            const cleanFens = fenList.map(f => f.trim()).slice(0, 9);

            let html = '<div class="header">' +
                '<div class="logo-box">' + (logoData ? '<img src="' + logoData + '">' : 'LOGO') + '</div>' +
                '<div class="title-block"><h2>' + title + '</h2><p>' + sub + '</p></div>' +
                '<div class="contact"><strong>Contact</strong><br>' + contact + '</div>' +
                '</div>' +
                '<div class="grid">' + cleanFens.map((f, i) => createPuzzle(f, i)).join('') + '</div>' +
                '<div class="footer-ws">EduChess Academy Puzzle Worksheet • generated by Chess Worksheet Pro</div>';
            document.getElementById('page').innerHTML = html;
        }

        function createPuzzle(fen, idx) {
            const parts = fen.split(/\s+/);
            const boardStr = parts[0];
            const turn = parts[1] || 'w';
            const rows = boardStr.split('/').map(r => {
                const row = [];
                for (const char of r) {
                    if (/\d/.test(char)) { for (let i = 0; i < parseInt(char); i++) row.push(''); }
                    else { row.push(char); }
                }
                return row;
            });

            let h = '<div class="puzzle">' +
                '<div class="p-meta"><span>Puzzle ' + (idx + 1) + '</span><span>' + (turn === 'w' ? 'White' : 'Black') + ' to move</span></div>' +
                '<div class="board-wrap"><div class="board">';

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const isLight = (r + c) % 2 === 0;
                    const piece = rows[r][c];
                    h += '<div class="square ' + (isLight ? 'light' : 'dark') + '">';
                    if (piece) h += '<span class="piece">' + (symbols[piece] || '') + '</span>';
                    if (r === 7) h += '<span class="coord f">' + 'abcdefgh'[c] + '</span>';
                    if (c === 0) h += '<span class="coord r">' + (8 - r) + '</span>';
                    h += '</div>';
                }
            }

            h += '</div></div><div class="move-text">' + (turn === 'w' ? 'White' : 'Black') + ' to move</div></div>';
            return h;
        }

        function clearFens() { document.getElementById('fens').value = ''; render(); }
        document.querySelectorAll('input, textarea').forEach(el => el.addEventListener('input', render));
        document.getElementById('logoIn').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => { logoData = reader.result; render(); };
            reader.readAsDataURL(file);
        });
        render();
    </script>
</body>
</html>
