<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Worksheet Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <style>
    :root {
      --primary: #0b6b6f;
      --primary-hover: #095357;
      --bg: #f0f4f8;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    /* ── App shell ── */
    .app { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      background: #fff;
      padding: 20px 16px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .brand h1 { font-family: 'Libre Baskerville', serif; font-size: 20px; margin: 0; color: var(--primary); }
    label { display: block; font-weight: 700; font-size: 11px; margin-bottom: 4px; color: var(--text-muted); text-transform: uppercase; }
    input, select, textarea {
      width: 100%; padding: 8px 11px;
      border: 2px solid var(--border); border-radius: 8px;
      font-size: 13px; background: var(--bg); color: var(--text); font-family: inherit;
    }
    textarea { height: 130px; font-family: monospace; resize: vertical; }
    .btn {
      width: 100%; padding: 10px; border-radius: 30px;
      font-weight: 700; cursor: pointer; border: none;
      font-size: 13px; background: var(--primary); color: #fff;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-print { background: #1e40af; margin-top: 4px; }
    .btn-print:hover { background: #1e3a8a; }

    /* ── Preview area ── */
    .preview { padding: 24px; background: #c8d0d8; overflow-y: auto; }
    #boardContainer { display: flex; flex-direction: column; gap: 24px; align-items: center; }

    /* ── Worksheet page ── */
    .ws-page {
      width: 794px;
      min-height: 1123px;
      background: #fff;
      padding: 28px 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ── Page header ── */
    .ws-header {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      align-items: center;
      gap: 14px;
      border-bottom: 3px solid #000;
      padding-bottom: 12px;
      margin-bottom: 18px;
    }
    .ws-logo { width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; border: 1.5px dashed #aaa; border-radius: 6px; overflow: hidden; }
    .ws-logo img { width: 100%; height: 100%; object-fit: contain; }
    .logo-placeholder { font-size: 9px; color: #aaa; text-align: center; }
    .ws-title-block { text-align: center; }
    .ws-title-block h2 { font-family: 'Libre Baskerville', serif; font-size: 18px; margin: 0 0 4px; }
    .ws-title-block p { font-size: 11px; color: #555; margin: 0; }
    .ws-contact { text-align: right; font-size: 11px; line-height: 1.5; font-weight: 600; color: #333; }

    /* ── 3x3 board grid ── */
    .ws-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 16px;
      flex: 1;
    }
    .ws-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ws-puzzle-num {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 4px;
      align-self: flex-start;
    }
    .ws-board { width: 100% !important; border: 1px solid #999; }
    .ws-turn {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      border: 1.5px solid #000;
      width: 100%;
      text-align: center;
      padding: 3px 0;
      margin-top: 5px;
      background: #f8f8f8;
      letter-spacing: 0.5px;
    }
    .error-fen { color: #dc2626; font-size: 11px; padding: 4px 8px; background: #fee2e2; border-radius: 4px; width: 100%; text-align: center; }

    /* ── Print styles ── */
    @media print {
      body { background: #fff !important; margin: 0; }
      .sidebar { display: none !important; }
      .app { display: block !important; }
      .preview { background: none !important; padding: 0 !important; overflow: visible !important; }
      #boardContainer { gap: 0 !important; align-items: stretch !important; }
      .ws-page {
        width: 210mm !important;
        min-height: 297mm !important;
        padding: 12mm 14mm !important;
        box-shadow: none !important;
        page-break-after: always;
      }
      .ws-grid { gap: 8px !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="brand"><h1>EduChess</h1></div>

      <div>
        <label>Worksheet Title</label>
        <input type="text" id="wsTitle" value="EduChess Academy Puzzle Worksheet">
      </div>

      <div>
        <label>Sub-header</label>
        <input type="text" id="wsSub" value="Solve the positions. White or Black to move is shown below each board.">
      </div>

      <div>
        <label>Contact / Phone</label>
        <input type="text" id="wsContact" value="+91 0000 0000 00">
      </div>

      <div>
        <label>Logo</label>
        <input type="file" id="logoIn" accept="image/*">
      </div>

      <div>
        <label>Puzzle Category</label>
        <select id="categoryMenu" onchange="if(this.value) loadFensArray(puzzles[this.value])">
          <option value="">-- Select Category --</option>
          <option value="mateInOne">Mate in 1</option>
          <option value="mateInTwo">Mate in 2</option>
          <option value="forks">Forks</option>
          <option value="pins">Pins</option>
        </select>
      </div>

      <div>
        <label>Custom FENs (one per line)</label>
        <textarea id="fenInput" spellcheck="false" placeholder="Paste FENs here..."></textarea>
        <button class="btn" id="loadCustomBtn" style="margin-top:8px;">Load FENs</button>
      </div>

      <button class="btn btn-print" onclick="window.print()">Print Worksheet</button>
    </div>

    <div class="preview">
      <div id="boardContainer"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="puzzles.js"></script>
  <script src="script.js"></script>
  <script>
    window.logoData = null;
    document.getElementById('logoIn').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function() { window.logoData = reader.result; };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
