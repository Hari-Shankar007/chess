<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Worksheet Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --primary: #0b6b6f;
            --primary-hover: #095357;
            --bg: #f7f4ee;
            --surface: #ffffff;
            --text: #211d18;
            --text-muted: #6a645d;
            --border: #d8d0c4;
            --radius: 8px;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.5;
        }

        .app { 
            display: grid; 
            grid-template-columns: 380px 1fr; 
            height: 100vh; 
        }

        .sidebar { 
            background: #fff; 
            padding: 24px; 
            border-right: 1px solid var(--border); 
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .preview { 
            padding: 40px; 
            overflow-y: auto; 
            display: flex; 
            justify-content: center; 
            background: #e2e0d8; 
        }

        .brand { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 12px; 
        }
        .brand svg { width: 32px; height: 32px; color: var(--primary); }
        .brand h1 { font-family: 'Libre Baskerville', serif; font-size: 20px; margin: 0; }

        .form-group { margin-bottom: 0; }
        label { 
            display: block; 
            font-weight: 600; 
            font-size: 13px; 
            margin-bottom: 6px; 
            color: var(--text-muted); 
        }

        input, textarea { 
            width: 100%; 
            padding: 10px 14px; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            font-size: 14px; 
            background: #fff;
        }
        textarea { height: 180px; font-family: monospace; resize: vertical; white-space: pre; }

        .actions { display: flex; gap: 12px; margin-top: 8px; }
        .btn { 
            flex: 1;
            padding: 12px; 
            border-radius: 24px; 
            font-weight: 600; 
            cursor: pointer; 
            border: none; 
            transition: 0.2s; 
            font-size: 14px; 
            text-align: center;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #fff; border: 1px solid var(--border); color: var(--text); }
        .btn-secondary:hover { background: #f9f9f9; }

        .page { 
            width: 210mm; 
            min-height: 297mm; 
            background: #fff; 
            padding: 15mm 20mm; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.15); 
            position: relative; 
            color: #000;
        }

        .header { 
            display: grid; 
            grid-template-columns: 100px 1fr 120px; 
            align-items: center; 
            gap: 20px; 
            border-bottom: 3px solid #000; 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
        }

        .logo-box { 
            width: 90px; 
            height: 90px; 
            border: 2px dashed #ccc; 
            display: grid; 
            place-items: center; 
            font-weight: bold; 
            font-size: 11px; 
            color: #aaa;
            text-transform: uppercase;
        }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .title-block { text-align: center; }
        .title-block h2 { font-family: 'Libre Baskerville', serif; font-size: 24px; margin: 0; }
        .title-block p { font-size: 13px; color: #444; margin: 8px 0 0; font-weight: 500; }

        .contact { text-align: right; font-size: 11px; line-height: 1.6; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12mm 10mm; 
        }

        .puzzle { break-inside: avoid; display: flex; flex-direction: column; }

        .p-meta { 
            display: flex; 
            justify-content: space-between; 
            font-weight: 800; 
            font-size: 12px; 
            border-bottom: 2px solid #000; 
            margin-bottom: 6px; 
            padding-bottom: 3px; 
        }

        .board-wrap { 
            width: 100%; 
            padding-top: 100%; 
            position: relative; 
            border: 2px solid #000; 
        }

        .board { 
            position: absolute; 
            top: 0; left: 0; right: 0; bottom: 0; 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            grid-template-rows: repeat(8, 1fr); 
        }

        .square { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
        }
        .light { background: #fff; }
        .dark { background: #d1d1d1; }

        .piece { 
            font-size: 44px; 
            line-height: 1; 
            z-index: 2; 
            user-select: none;
            display: block;
            margin-top: -4px;
        }

        .coord { 
            position: absolute; 
            font-size: 8px; 
            font-weight: 900; 
            font-family: 'Inter', sans-serif; 
            z-index: 1; 
        }
        .coord.f { right: 2px; bottom: 1px; }
        .coord.r { left: 2px; top: 1px; }

        .move-text { 
            text-align: center; 
            font-size: 11px; 
            font-weight: 700; 
            margin-top: 8px; 
            padding: 4px; 
            border: 1.5px solid #000; 
            background: #f9f9f9;
        }

        .footer-ws { 
            position: absolute; 
            bottom: 10mm; 
            left: 0; right: 0; 
            text-align: center; 
            font-size: 10px; 
            color: #777; 
            border-top: 1px solid #eee; 
            padding-top: 10px; 
            margin: 0 20mm; 
        }

        @media print {
            .sidebar { display: none !important; }
            .preview { padding: 0 !important; background: none !important; display: block !important; }
            .page { 
                width: 100% !important; 
                height: 100% !important;
                box-shadow: none !important; 
                margin: 0 !important; 
                padding: 10mm 15mm !important; 
            }
            .app { display: block !important; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                <h1>Chess Worksheet</h1>
            </div>

            <div class="form-group">
                <label>Worksheet Title</label>
                <input type="text" id="wsTitle" value="EduChess Academy Puzzle Worksheet">
            </div>

            <div class="form-group">
                <label>Contact Info</label>
                <input type="text" id="wsContact" value="+91 0000 0000 00">
            </div>

            <div class="form-group">
                <label>Instructions</label>
                <input type="text" id="wsSub" value="Solve the positions. White or Black to move is shown below each board.">
            </div>

            <div class="form-group">
                <label>Academy Logo</label>
                <input type="file" id="logoIn" accept="image/*">
            </div>

            <div class="form-group">
                <label>FEN Positions (one per line)</label>
                <textarea id="fens" spellcheck="false" placeholder="Paste FENs here...">r1bqkbnr/pppp1ppp/2n5/4p3/3P4/2N2N2/PPP1PPPP/R1BQKB1R w KQkq - 2 4
2r3k1/5ppp/p2b4/1p1P4/1P6/P3R1P1/5P1P/4R1K1 w - - 0 1
6k1/5pp1/7p/8/8/5P2/5KPP/8 w - - 0 1
r4rk1/pp1n1ppp/2pbpn2/q7/3P4/2N1PN2/PPQ2PPP/R1B2RK1 w - - 0 1
8/8/3k4/3p4/3P4/3K4/8/8 w - - 0 1
6k1/1p3pp1/p6p/3P4/1P6/P5PP/5PK1/8 w - - 0 1
r2q1rk1/ppp2ppp/2n2n2/3bp3/3P4/2PB1N2/PP3PPP/RNBQ1RK1 w - - 0 1
8/2p5/1p1p4/p2Ppk2/P1P1P3/3K4/8/8 w - - 0 1
2r3k1/5pp1/p6p/1p1P4/1P3P2/P5P1/6KP/2R5 w - - 0 1</textarea>
            </div>

            <div class="actions">
                <button class="btn btn-primary" onclick="window.print()">Print Worksheet</button>
                <button class="btn btn-secondary" onclick="clearFens()">Clear FENs</button>
            </div>
        </aside>

        <main class="preview">
            <div class="page" id="page"></div>
        </main>
    </div>

    <script>
        const symbols = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        let logoData = null;

        function render() {
            const title = document.getElementById('wsTitle').value;
            const contact = document.getElementById('wsContact').value;
            const sub = document.getElementById('wsSub').value;
            const fensText = document.getElementById('fens').value;
            
            const fenList = fensText.match(/[rnbqkpRNBQKP1-8\/]+ [wb] \S+ \S+ \d+ \d+/g) || []
                .map(f => f.trim())
                .filter(f => f.length > 0 && f.includes('/'))
                .slice(0, 9);

            let html = `
                <div class="header">
                    <div class="logo-box">${logoData ? `<img src="${logoData}">` : 'No Logo'}</div>
                    <div class="title-block">
                        <h2>${title}</h2>
                        <p>${sub}</p>
                    </div>
                    <div class="contact">
                        <strong>Contact</strong><br>${contact}
                    </div>
                </div>
                <div class="grid">
                    ${fenList.map((f, i) => createPuzzle(f, i)).join('')}
                </div>
                <div class="footer-ws">EduChess Academy Puzzle Worksheet • Generated by Chess Worksheet Pro</div>
            `;
            document.getElementById('page').innerHTML = html;
        }

        function createPuzzle(fen, idx) {
            const parts = fen.split(/\s+/);
            const boardStr = parts[0];
            const turn = parts[1] || 'w';
            
            const rows = boardStr.split('/').map(r => {
                const row = [];
                for (const char of r) {
                    if (/\d/.test(char)) {
                        for (let i = 0; i < parseInt(char); i++) row.push('');
                    } else {
                        row.push(char);
                    }
                }
                return row;
            });

            let h = `
                <div class="puzzle">
                    <div class="p-meta">
                        <span>Puzzle ${idx + 1}</span>
                        <span>${turn === 'w' ? 'White' : 'Black'} to move</span>
                    </div>
                    <div class="board-wrap">
                        <div class="board">
            `;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const isLight = (r + c) % 2 === 0;
                    const piece = rows[r][c];
                    h += `<div class="square ${isLight ? 'light' : 'dark'}">`;
                    if (piece) {
                        h += `<span class="piece">${symbols[piece] || ''}</span>`;
                    }
                    if (r === 7) h += `<span class="coord f">${'abcdefgh'[c]}</span>`;
                    if (c === 0) h += `<span class="coord r">${8 - r}</span>`;
                    h += `</div>`;
                }
            }

            h += `
                        </div>
                    </div>
                    <div class="move-text">${turn === 'w' ? 'White' : 'Black'} to move</div>
                </div>
            `;
            return h;
        }

        function clearFens() {
            document.getElementById('fens').value = '';
            render();
        }

        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('input', render);
        });

        document.getElementById('logoIn').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                logoData = reader.result;
                render();
            };
            reader.readAsDataURL(file);
        });

        render();
    </script>
</body>
</html>
