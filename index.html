<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Worksheet Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
      --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.08); --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
      --color-bg: #f7f4ee; --color-surface: #ffffff; --color-surface-2: #f1ece3;
      --color-text: #211d18; --color-text-muted: #6a645d; --color-border: #d8d0c4;
      --color-primary: #0b6b6f; --color-primary-hover: #095357; --color-accent: #d8b25f;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; print-color-adjust: exact; }
    body { margin: 0; font-family: 'Inter', sans-serif; font-size: var(--text-base); color: var(--color-text); background: linear-gradient(180deg, #f8f5ef 0%, #efe8dc 100%); }
    h1, h2, h3, h4, p { margin: 0; }
    button, input, textarea { font: inherit; }

    .app { display: grid; grid-template-columns: minmax(320px, 430px) 1fr; min-height: 100vh; }
    .panel { background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); border-right: 1px solid var(--color-border); padding: var(--space-6); overflow: auto; }
    .preview-wrap { padding: var(--space-6); overflow: auto; display: flex; justify-content: center; background: #e0ddd7; }

    .brand { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-6); }
    .brand svg { width: 32px; height: 32px; color: var(--color-primary); }
    .brand-title { font-family: 'Libre Baskerville', serif; font-size: var(--text-lg); }

    .intro { color: var(--color-text-muted); font-size: var(--text-sm); margin-bottom: var(--space-6); line-height: 1.6; }
    .form-group { margin-bottom: var(--space-5); }
    label { display: block; font-weight: 600; margin-bottom: var(--space-2); font-size: var(--text-sm); }
    input[type="text"], textarea { width: 100%; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); padding: 0.8rem 0.95rem; color: var(--color-text); }
    textarea { min-height: 160px; resize: vertical; font-family: monospace; font-size: 13px; }

    .logo-upload { display: flex; gap: var(--space-3); align-items: center; }
    .logo-preview-box { width: 64px; height: 64px; border: 1px dashed var(--color-border); border-radius: var(--radius-md); display: grid; place-items: center; background: var(--color-surface-2); font-size: 10px; color: var(--color-text-muted); text-align: center; }
    .logo-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .actions { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-6); }
    .btn { border: none; border-radius: 999px; padding: 0.8rem 1.2rem; font-weight: 600; cursor: pointer; transition: 150ms ease; }
    .btn-primary { background: var(--color-primary); color: #fff; }
    .btn-secondary { background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); }

    /* A4 Page Styles */
    .page { width: 210mm; min-height: 297mm; background: white; padding: 12mm; color: #111; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; }
    .worksheet-header { display: grid; grid-template-columns: 85px 1fr 100px; align-items: center; gap: 15px; border-bottom: 2.5px solid #111; padding-bottom: 10px; margin-bottom: 12px; }
    .header-logo { width: 80px; height: 80px; object-fit: contain; }
    .header-logo-placeholder { width: 80px; height: 80px; border: 1.5px solid #111; display: grid; place-items: center; font-weight: 800; font-size: 10px; text-align: center; padding: 5px; }
    .title-block { text-align: center; }
    .worksheet-title { font-family: 'Libre Baskerville', serif; font-size: 26px; margin-bottom: 4px; }
    .worksheet-subtitle { font-size: 12px; color: #333; }
    .contact-block { text-align: right; font-size: 11px; line-height: 1.4; }

    .puzzle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10mm 8mm; }
    .puzzle { break-inside: avoid; display: flex; flex-direction: column; }
    .puzzle-meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; margin-bottom: 3mm; border-bottom: 1px solid #eee; padding-bottom: 1mm; }
    
    .board-wrap { border: 2.5px solid #111; width: 100%; aspect-ratio: 1/1; background: #fff; position: relative; }
    .board { display: grid; grid-template-columns: repeat(8, 1fr); height: 100%; }
    .square { display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .piece-char { font-size: 48px; font-family: "Segoe UI Symbol", "Apple Color Emoji", "Noto Color Emoji", serif; line-height: 1; z-index: 2; pointer-events: none; }
    
    /* Green Theme */
    .light { background: #ebecd0; }
    .dark { background: #779556; }
    
    .coord { position: absolute; font-size: 9px; font-weight: 900; z-index: 1; font-family: monospace; }
    .coord.file { right: 2px; bottom: 1px; }
    .coord.rank { left: 2px; top: 1px; }
    .light .coord { color: #779556; }
    .dark .coord { color: #ebecd0; }

    .side-to-move { margin-top: 3mm; font-size: 11px; font-weight: 700; text-align: center; background: #f4f4f4; padding: 2px; border-radius: 4px; border: 1px solid #ddd; }
    
    .footer-note { margin-top: 15px; text-align: center; font-size: 10px; color: #666; font-style: italic; border-top: 1px solid #eee; padding-top: 5px; }

    @page { size: A4; margin: 0; }
    @media print {
      body { background: white; }
      .panel { display: none; }
      .preview-wrap { padding: 0; background: none; }
      .page { box-shadow: none; margin: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <div class="brand-title">Chess Worksheet</div>
      </div>
      
      <div class="form-group">
        <label>Worksheet Title</label>
        <input id="worksheetTitle" type="text" value="EduChess Academy Puzzle Worksheet">
      </div>

      <div class="form-group">
        <label>Phone / Contact</label>
        <input id="academyPhone" type="text" value="+91 0000 0000 00">
      </div>

      <div class="form-group">
        <label>Subtitle / Instructions</label>
        <input id="academySubtitle" type="text" value="Solve the 9 positions. Determine the best move for the side indicated.">
      </div>

      <div class="form-group">
        <label>Academy Logo</label>
        <div class="logo-upload">
          <input id="logoInput" type="file" accept="image/*">
          <div id="logoPreviewBox" class="logo-preview-box">No Logo</div>
        </div>
      </div>

      <div class="form-group">
        <label>FEN List (max 9)</label>
        <textarea id="fenInput" spellcheck="false">r1bqkbnr/pppp1ppp/2n5/4p3/3P4/2N2N2/PPP1PPPP/R1BQKB1R w KQkq - 2 4
2r3k1/5ppp/p2b4/1p1P4/1P6/P3R1P1/5P1P/4R1K1 w - - 0 1
6k1/5pp1/7p/8/8/5P2/5KPP/8 w - - 0 1
r4rk1/pp1n1ppp/2pbpn2/q7/3P4/2N1PN2/PPQ2PPP/R1B2RK1 w - - 0 1
8/8/3k4/3p4/3P4/3K4/8/8 w - - 0 1
6k1/1p3pp1/p6p/3P4/1P6/P5PP/5PK1/8 w - - 0 1
r2q1rk1/ppp2ppp/2n2n2/3bp3/3P4/2PB1N2/PP3PPP/RNBQ1RK1 w - - 0 1
8/2p5/1p1p4/p2Ppk2/P1P1P3/3K4/8/8 w - - 0 1
2r3k1/5pp1/p6p/1p1P4/1P3P2/P5P1/6KP/2R5 w - - 0 1</textarea>
      </div>

      <div class="actions">
        <button id="printBtn" class="btn btn-primary">Print to PDF</button>
        <button id="clearBtn" class="btn btn-secondary">Clear All</button>
      </div>
    </div>

    <div class="preview-wrap">
      <div id="pagePreview" class="page"></div>
    </div>
  </div>

  <script>
    const pieces = { 'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙', 'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟' };
    const files = ['a','b','c','d','e','f','g','h'];
    
    const titleInput = document.getElementById('worksheetTitle');
    const phoneInput = document.getElementById('academyPhone');
    const subtitleInput = document.getElementById('academySubtitle');
    const fenInput = document.getElementById('fenInput');
    const pagePreview = document.getElementById('pagePreview');
    const logoInput = document.getElementById('logoInput');
    const logoPreviewBox = document.getElementById('logoPreviewBox');

    let logoDataUrl = '';

    function isValidFen(fen) {
      if (!fen || !fen.trim()) return false;
      const parts = fen.trim().split(/\s+/);
      if (parts.length < 1) return false;
      const rows = parts[0].split('/');
      return rows.length === 8;
    }

    function expandFenRow(row) {
      const squares = [];
      for (const char of row) {
        if (/\d/.test(char)) {
          for (let i = 0; i < parseInt(char); i++) squares.push('');
        } else {
          squares.push(char);
        }
      }
      return squares;
    }

    function createBoardHTML(fen, index) {
      const parts = fen.trim().split(/\s+/);
      const boardPart = parts[0];
      const side = parts[1] || 'w';
      const rows = boardPart.split('/').map(expandFenRow);

      let html = `<div class="puzzle">`;
      html += `<div class="puzzle-meta"><span>Puzzle ${index + 1}</span><span>${side === 'w' ? 'White' : 'Black'} to move</span></div>`;
      html += `<div class="board-wrap"><div class="board">`;

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const isLight = (r + c) % 2 === 0;
          const piece = rows[r][c];
          html += `<div class="square ${isLight ? 'light' : 'dark'}">`;
          if (piece) html += `<span class="piece-char">${pieces[piece]}</span>`;
          if (r === 7) html += `<span class="coord file">${files[c]}</span>`;
          if (c === 0) html += `<span class="coord rank">${8 - r}</span>`;
          html += `</div>`;
        }
      }
      html += `</div></div>`;
      html += `<div class="side-to-move">${side === 'w' ? 'White to move' : 'Black to move'}</div>`;
      html += `</div>`;
      return html;
    }

    function render() {
      const title = titleInput.value.trim() || 'Worksheet';
      const phone = phoneInput.value.trim();
      const subtitle = subtitleInput.value.trim();
      const fens = fenInput.value.split(/
/).map(f => f.trim()).filter(f => isValidFen(f)).slice(0, 9);

      let html = `
        <div class="worksheet-header">
          <div>${logoDataUrl ? `<img src="${logoDataUrl}" class="header-logo">` : `<div class="header-logo-placeholder">LOGO HERE</div>`}</div>
          <div class="title-block">
            <div class="worksheet-title">${title}</div>
            <div class="worksheet-subtitle">${subtitle}</div>
          </div>
          <div class="contact-block"><strong>Contact</strong><br>${phone}</div>
        </div>
        <div class="puzzle-grid">
          ${fens.map((f, i) => createBoardHTML(f, i)).join('')}
        </div>
        <div class="footer-note">Generated by Chess Worksheet Pro • ${fens.length} positions</div>
      `;
      pagePreview.innerHTML = html;
    }

    [titleInput, phoneInput, subtitleInput, fenInput].forEach(el => el.addEventListener('input', render));
    
    logoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        logoDataUrl = reader.result;
        logoPreviewBox.innerHTML = `<img src="${logoDataUrl}">`;
        render();
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('clearBtn').addEventListener('click', () => { fenInput.value = ''; render(); });

    render();
  </script>
</body>
</html>
